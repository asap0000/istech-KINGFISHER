name: Record Golden Images

# テストの基準画像(ゴールデン)を CI 上で記録し、実行ブランチにコミットする。
# ローカル環境差(フォント・Skia)の影響を受けないよう、基準画像は必ず
# この CI(Linux ランナー)で生成する。
#
# 使いどころ:
#   - テスト基盤導入後の初回記録
#   - 意図した UI/マスキング変更で基準画像を更新するとき
# 実行後、android.yml の "Run unit & golden tests" が新基準との比較になる。

on:
  workflow_dispatch:

# 守り（2026-10-24）: 既定は読み取りだけ。書き込み（記録した見本のコミット）は record ジョブだけ
permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # v3 の既定は "tools platform-tools"。旧 SDK Tools (`tools`) は Google の
          # リポジトリから消えており、sdkmanager が "Failed to find package 'tools'" で
          # 落ちる（2026-09-21 実測・09-14 の定期実行までは通っていた）。この行より後で
          # 必要な package は明示的に入れているので、既定を空にせず明示で上書きする。
          packages: 'platform-tools'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Record golden images
        run: ./gradlew :app:recordRoborazziProDebug -PupdateGoldens=true --no-daemon --stacktrace

      - name: Commit recorded goldens to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/goldens app/src/test/screenshots
          if git diff --cached --quiet; then
            echo "No golden changes to commit."
          else
            git commit -m "test: record golden images (record-goldens workflow)"
            git push
          fi
